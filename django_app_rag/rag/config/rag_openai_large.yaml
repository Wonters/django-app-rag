# Configuration RAG optimisée avec OpenAI text-embedding-3-large
# Meilleure qualité pour production avec API OpenAI
# Score MTEB: 64.6 - Multilingue excellent

# Fichiers locaux
file_paths:
  - "data/input/documents/document1.txt"
  - "data/input/documents/document2.md"
  - "data/input/documents/document3.pdf"

# URLs web
urls:
  - "https://example.com/article1"
  - "https://example.com/article2"
  - "https://example.com/documentation"

# Bases de données Notion
notion_database_ids:
  - "database_id_1"
  - "database_id_2"

data_dir: "data"
to_s3: false
max_workers: 10
collection_name: "mixed_collection"
quality_agent_model_id: "gpt-4o-mini"
quality_agent_mock: false
include_notion: true
include_files: true
include_urls: true

fetch_limit: 200
content_quality_score_threshold: 0.6
retriever_type: parent

# ✨ EMBEDDING MODEL - OpenAI text-embedding-3-large (RECOMMANDÉ)
embedding_model_id: text-embedding-3-large
embedding_model_type: openai
embedding_model_dim: 3072  # Dimension correcte

chunk_size: 640
contextual_summarization_type: simple
contextual_agent_model_id: gpt-4o-mini
contextual_agent_max_characters: 128
mock: false
processing_batch_size: 4  # Peut augmenter avec API
processing_max_workers: 4
device: cpu  # N/A pour OpenAI (API)
storage_mode: overwrite
