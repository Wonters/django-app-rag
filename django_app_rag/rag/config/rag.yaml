# Configuration unifiée pour la collecte de données depuis différentes sources
# Fichiers locaux
file_paths:
  - "data/input/documents/document1.txt"
  - "data/input/documents/document2.md"
  - "data/input/documents/document3.pdf"

# URLs web
urls:
  - "https://example.com/article1"
  - "https://example.com/article2"
  - "https://example.com/documentation"

# Bases de données Notion
notion_database_ids:
  - "database_id_1"
  - "database_id_2"

data_dir: "data"
to_s3: false
max_workers: 10 
collection_name: "mixed_collection"
quality_agent_model_id: "gpt-4o-mini"
quality_agent_mock: false
include_notion: true
include_files: true
include_urls: true 

fetch_limit: 200
content_quality_score_threshold: 0.6
retriever_type: parent

# ✨ EMBEDDING MODEL - Alibaba GTE-large (Meilleur open-source CPU-friendly)
# Pour meilleure qualité, voir: rag_openai_large.yaml ou rag_bge_m3.yaml
embedding_model_id: Alibaba-NLP/gte-large-en-v1.5  # Ancien: sentence-transformers/all-MiniLM-L6-v2
embedding_model_type: huggingface
embedding_model_dim: 1024  # Corrigé: 1536 était incorrect (384 pour MiniLM, 1024 pour GTE)

chunk_size: 640
contextual_summarization_type: simple
contextual_agent_model_id: gpt-4o-mini
contextual_agent_max_characters: 128
mock: false
processing_batch_size: 2
processing_max_workers: 2
device: cpu # or cuda (for Nvidia GPUs) or mps (for Apple M1/M2/M3 chips)
storage_mode: overwrite

# ── Retrieval ─────────────────────────────────────────────────────────────────

# Nombre de documents retournés par le retriever
retriever_k: 5

# Seuil de similarité (cosine) pour filtrer les résultats FAISS
similarity_score_threshold: 0.55

# Tailles des chunks parent/enfant pour le ParentDocumentRetriever
# child: indexé dans FAISS (granulaire, pour la recherche)
# parent: retourné au LLM (plus contextuel)
child_chunk_size: 200
parent_chunk_size: 800

# ── Retrieval hybride (FAISS + BM25) ─────────────────────────────────────────
# Combine la recherche dense (embeddings) et sparse (BM25) via RRF.
# Améliore le recall sur les termes techniques exacts (codes, noms propres).
# Nécessite: pip install rank-bm25
use_hybrid_retrieval: false

# ── Reranking ─────────────────────────────────────────────────────────────────
# Reclasse les documents récupérés avec un CrossEncoder avant envoi au LLM.
# Améliore la précision sans changer le recall.
# Mettre à null pour désactiver. Modèles recommandés:
#   - cross-encoder/ms-marco-MiniLM-L-6-v2  (rapide, anglais)
#   - cross-encoder/mmarco-mMiniLMv2-L12-H384-v1  (multilingue)
reranker_model_id: ~  # null: désactivé par défaut
