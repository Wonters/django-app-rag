# Configuration RAG optimisée avec BGE-M3 (Open-source)
# Meilleure qualité open-source - Nécessite GPU (8GB+ VRAM)
# Score MTEB: 63.0 - Multilingue (100+ langues)

# Fichiers locaux
file_paths:
  - "data/input/documents/document1.txt"
  - "data/input/documents/document2.md"
  - "data/input/documents/document3.pdf"

# URLs web
urls:
  - "https://example.com/article1"
  - "https://example.com/article2"
  - "https://example.com/documentation"

# Bases de données Notion
notion_database_ids:
  - "database_id_1"
  - "database_id_2"

data_dir: "data"
to_s3: false
max_workers: 10
collection_name: "mixed_collection"
quality_agent_model_id: "gpt-4o-mini"
quality_agent_mock: false
include_notion: true
include_files: true
include_urls: true

fetch_limit: 200
content_quality_score_threshold: 0.6
retriever_type: parent

# ✨ EMBEDDING MODEL - BGE-M3 (MEILLEUR OPEN-SOURCE)
embedding_model_id: BAAI/bge-m3
embedding_model_type: huggingface
embedding_model_dim: 1024  # Dimension correcte

chunk_size: 640
contextual_summarization_type: simple
contextual_agent_model_id: gpt-4o-mini
contextual_agent_max_characters: 128
mock: false
processing_batch_size: 2  # Ajuster selon GPU
processing_max_workers: 2
device: cuda  # Ou "mps" pour Apple Silicon M1/M2/M3
storage_mode: overwrite
