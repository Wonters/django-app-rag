version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: django-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  redis:
    image: redis:7-alpine
    container_name: django-rag-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  app:
    image: ${DOCKER_IMAGE}
    container_name: django-rag-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Django
      DJANGO_SETTINGS_MODULE: myproject.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-django_rag}

      # Redis
      REDIS_URL: redis://redis:6379/0

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_ID: ${OPENAI_MODEL_ID:-gpt-4o-mini}

      # RAG Settings
      ENABLE_RAG_FEATURES: ${ENABLE_RAG_FEATURES:-True}
      ENABLE_CACHE: ${ENABLE_CACHE:-True}

      # Notion (optionnel)
      NOTION_SECRET_KEY: ${NOTION_SECRET_KEY:-}

      # AWS S3 (optionnel)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
    volumes:
      - rag_data:/app/data
      - media_files:/app/media
      - static_files:/app/static
      - log_files:/app/log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_network

  dramatiq:
    image: ${DOCKER_IMAGE}
    container_name: django-rag-dramatiq
    restart: unless-stopped
    command: python manage.py rundramatiq --processes 2 --threads 4
    environment:
      # Mêmes variables que app
      DJANGO_SETTINGS_MODULE: myproject.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-django_rag}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_ID: ${OPENAI_MODEL_ID:-gpt-4o-mini}
      ENABLE_RAG_FEATURES: ${ENABLE_RAG_FEATURES:-True}
      ENABLE_CACHE: ${ENABLE_CACHE:-True}
      NOTION_SECRET_KEY: ${NOTION_SECRET_KEY:-}
    volumes:
      - rag_data:/app/data
      - media_files:/app/media
      - log_files:/app/log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network

  nginx:
    image: nginx:alpine
    container_name: django-rag-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/static:ro
      - media_files:/app/media:ro
      - ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - rag_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rag_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  log_files:
    driver: local
  ssl_certs:
    driver: local

networks:
  rag_network:
    driver: bridge
